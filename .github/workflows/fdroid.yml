name: F-Droid APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fdroid:
    name: Build F-Droid ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0'

      - name: Add Android 37 compatibility alias
        run: ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build F-Droid APK
        run: ./gradlew assembleFdroidRelease -Pfdroid -PfdroidAbi=${{ matrix.abi }} --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: shinigami-fdroid-${{ matrix.abi }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
