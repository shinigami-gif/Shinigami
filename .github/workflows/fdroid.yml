name: F-Droid APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fdroid:
    name: Build F-Droid ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build F-Droid APK
        run: ./gradlew assembleFdroidRelease -Pfdroid -PfdroidAbi=${{ matrix.abi }} --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shinigami-fdroid-${{ matrix.abi }}
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
