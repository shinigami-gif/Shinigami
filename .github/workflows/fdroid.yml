name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-google:
    name: Build Google Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0'

      - name: Add Android 37 compatibility alias
        run: ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Build Google Release APK
        run: ./gradlew assembleGoogleRelease -PsingleApk --no-daemon

      - name: Verify single APK
        run: |
          set -e
          ls -lah app/build/outputs/apk
          APK_COUNT=$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)
          test "$APK_COUNT" -eq 1

      - name: Upload single APK
        uses: actions/upload-artifact@v7
        with:
          name: shinigami-google-release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
