name: Control Panel Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-panel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test Control Panel backend
        run: |
          set -euo pipefail
          chmod +x backend/gradlew
          (cd backend && ./gradlew) :compileKotlin --no-daemon --stacktrace
          (cd backend && ./gradlew) :test :streamix-core:test --no-daemon --stacktrace

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: control-panel-backend-build
          path: |
            backend/build/outputs/**
            backend/build/libs/**
            backend/streamix-core/build/libs/**
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-panel-test-reports
          path: |
            backend/build/test-results/**
            backend/build/reports/tests/**
            backend/streamix-core/build/test-results/**
            backend/streamix-core/build/reports/tests/**
          if-no-files-found: warn
