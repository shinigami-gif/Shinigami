name: Import Final Backend

on:
  push:
    branches:
      - compile-cleanup
    paths:
      - ".github/workflows/import-final-backend.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Shinigami
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Backend main
        shell: bash
        run: |
          set -euo pipefail

          rm -rf backend
          git clone --depth 1 --branch main https://github.com/shinigami-gif/Backend.git /tmp/shinigami-backend

          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             --exclude='Backend-feat-jvm-streamix-core-foundation (6).zip'             /tmp/shinigami-backend/ backend/

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("settings.gradle.kts")
          text = settings.read_text()
          if 'include(":backend:streamix-core")' not in text:
              text = text.replace('include(":backend")', 'include(":backend")\ninclude(":backend:streamix-core")')
          settings.write_text(text)

          build = Path("backend/build.gradle.kts")
          text = build.read_text()
          text = text.replace('implementation(project(":streamix-core"))',
                              'implementation(project(":backend:streamix-core"))')
          build.write_text(text)
          PY

      - name: Verify imported backend
        run: ./gradlew :backend:test --no-daemon

      - name: Commit imported backend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend settings.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m "chore: import final backend into Shinigami"
          git push origin HEAD:compile-cleanup

      - name: Remove one-time importer
        if: success()
        shell: bash
        run: |
          git fetch origin compile-cleanup
          git checkout compile-cleanup
          git rm .github/workflows/import-final-backend.yml
          git commit -m "chore: remove one-time backend importer"
          git push origin HEAD:compile-cleanup
