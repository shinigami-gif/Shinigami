name: Provider Pool E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Versi-1
  schedule:
    - cron: "17 2 * * *"

jobs:
  provider-pool-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run provider pool E2E
        run: |
          set -euo pipefail
          chmod +x backend/gradlew
          (cd backend && ./gradlew) :liveE2eTest --no-daemon --stacktrace
